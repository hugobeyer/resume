<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roland XPS-30 - Galeria</title>
<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
.wrap{
  max-width:980px;
  margin:0 auto;
  padding:24px;
}
.header{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start;
  margin-bottom:18px;
}
h1{
  margin:0 0 6px;
  font-size:30px;
}
.price{
  font-size:22px;
  font-weight:bold;
  color:#9cff9c;
}
.meta{
  color:#d0d0d0;
  line-height:1.45;
}
.contact{
  margin-top:8px;
  color:#fff;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:12px;
}
.grid a{
  display:block;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #333;
  background:#000;
}
.grid img{
  width:100%;
  display:block;
}
.back{
  color:#ccc;
  text-decoration:none;
  font-size:13px;
}
@media(max-width:620px){
  .header{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>Roland XPS-30</h1>
      <div class="price">R$ 5.700 negociável</div>
      <div class="meta">Comprado na Drumshop • Caixa original • Fonte e manuais inclusos • Estado de novo</div>
      <div class="contact">Hugo Carreiro Beyer • hugobeyer@gmail.com • Whats: (41) 98846-5199</div>
    </div>
    <a class="back" href="banner-preview.html">voltar ao banner</a>
  </div>

  <div class="grid">
    <a href="images/photo_01.jpg"><img src="images/thumb_01.jpg" alt="Roland XPS-30 foto 1"></a>
    <a href="images/photo_02.jpg"><img src="images/thumb_02.jpg" alt="Roland XPS-30 foto 2"></a>
    <a href="images/photo_03.jpg"><img src="images/thumb_03.jpg" alt="Roland XPS-30 foto 3"></a>
    <a href="images/photo_04.jpg"><img src="images/thumb_04.jpg" alt="Roland XPS-30 foto 4"></a>
    <a href="images/photo_05.jpg"><img src="images/thumb_05.jpg" alt="Roland XPS-30 foto 5"></a>
    <a href="images/photo_06.jpg"><img src="images/thumb_06.jpg" alt="Roland XPS-30 foto 6"></a>
  </div>
</div>
</body>
</html>
